<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Applications — Job Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
      .bg-gradient-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }
      .stat-box {
        padding: 10px;
        border-radius: 8px;
        text-align: center;
        min-width: 80px;
      }
      .stat-box .value {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 2px;
      }
      .stat-box .label {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body class="bg-light">
    {% set active_page = 'applications' %}
    {% include 'navbar.html' %}

    <div class="container py-3">
      <!-- Date Range Filter -->
      <div class="card shadow-sm mb-2">
        <div class="card-body py-2">
          <div class="row align-items-center g-2">
            <div class="col-md-2">
              <label class="form-label small mb-1" style="font-size: 11px; font-weight: 500;">Start Date</label>
              <input type="date" id="start-date" class="form-control form-control-sm">
            </div>
            <div class="col-md-2">
              <label class="form-label small mb-1" style="font-size: 11px; font-weight: 500;">End Date</label>
              <input type="date" id="end-date" class="form-control form-control-sm">
            </div>
            <div class="col-md-2">
              <label class="form-label small mb-1" style="font-size: 11px; font-weight: 500;">Status Filter</label>
              <select id="filter-status" class="form-select form-select-sm">
                <option value="">All Statuses</option>
                <option>Applied</option>
                <option>Interview</option>
                <option>Offer</option>
                <option>Rejected</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label small mb-1" style="font-size: 11px; font-weight: 500;">Search</label>
              <input id="search" class="form-control form-control-sm" placeholder="Search by company or position...">
            </div>
          </div>
        </div>
      </div>

      <div class="row g-3">
        <div class="col-lg-9">
          <div class="card shadow-sm mb-2">
            <div class="card-body py-2">
              <h5 class="card-title mb-0" style="font-size: 16px;">Applications</h5>
              <small class="text-muted" style="font-size: 12px;">Track and manage your job applications</small>
            </div>
          </div>

          <div id="apps-list" class="mt-2"></div>
        </div>

        <div class="col-lg-3">
          <div class="card shadow-sm sticky-top" style="top: 20px;">
            <div class="card-body">
              <h5 class="card-title"><i class="bi bi-plus-circle"></i> Add Application</h5>
              <div class="mb-2">
                <input id="company" class="form-control" placeholder="Company">
              </div>
              <div class="mb-2">
                <input id="position" class="form-control" placeholder="Position">
              </div>
              <div class="mb-2">
                <select id="source" class="form-select">
                  <option value="manual">Manual</option>
                  <option value="linkedin">LinkedIn</option>
                  <option value="gmail">Gmail</option>
                </select>
              </div>
              <div class="mb-3">
                <textarea id="notes" class="form-control" rows="2" placeholder="Notes (optional)"></textarea>
              </div>
              <div class="d-grid">
                <button id="add-btn" class="btn btn-primary">Add Application</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal fade" id="editModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title"><i class="bi bi-pencil-square"></i> Edit Application</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="edit-id">
            <div class="mb-3">
              <label class="form-label">Company</label>
              <input id="edit-company" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label">Position</label>
              <input id="edit-position" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label">Source</label>
              <select id="edit-source" class="form-select">
                <option value="manual">Manual</option>
                <option value="linkedin">LinkedIn</option>
                <option value="gmail">Gmail</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Status</label>
              <select id="edit-status" class="form-select">
                <option>Applied</option>
                <option>Interview</option>
                <option>Offer</option>
                <option>Rejected</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Notes</label>
              <textarea id="edit-notes" class="form-control" rows="3"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" id="save-edit-btn">Save Changes</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
      <div class="modal-dialog modal-sm">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title"><i class="bi bi-trash"></i> Confirm Delete</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <p>Are you sure you want to delete this application?</p>
            <input type="hidden" id="delete-id">
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-danger" id="confirm-delete-btn">Delete</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="/static/js/main.js"></script>
  </body>
</html>
