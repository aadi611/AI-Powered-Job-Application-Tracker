<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Job Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden;
            height: 100vh;
            background: #f5f5f7;
        }

        /* Clean White Background with Subtle Gradient */
        .gradient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, 
                #ffffff 0%, 
                #f5f5f7 50%, 
                #e8e8ed 100%);
            background-size: 200% 200%;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating shapes - Blue Themed */
        .shape {
            position: absolute;
            opacity: 0.03;
            animation: float 20s infinite ease-in-out;
        }

        .shape-1 {
            width: 300px;
            height: 300px;
            background: #0071e3;
            border-radius: 50%;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .shape-2 {
            width: 200px;
            height: 200px;
            background: #007aff;
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
            bottom: 20%;
            right: 15%;
            animation-delay: 5s;
        }

        .shape-3 {
            width: 150px;
            height: 150px;
            background: #0071e3;
            border-radius: 50%;
            top: 60%;
            left: 70%;
            animation-delay: 10s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(10deg); }
        }

        /* Login container */
        .login-container {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-radius: 24px;
            padding: 48px;
            width: 100%;
            max-width: 420px;
            box-shadow: 
                0 20px 25px rgba(0, 0, 0, 0.08),
                0 10px 10px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.06);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .logo {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #0071e3, #0051a8);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            box-shadow: 0 8px 20px rgba(0, 113, 227, 0.35);
        }

        .logo i {
            font-size: 36px;
            color: white;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
            color: #1d1d1f;
            letter-spacing: -0.03em;
        }

        .subtitle {
            text-align: center;
            color: #86868b;
            margin-bottom: 32px;
            font-size: 17px;
            line-height: 1.47059;
            letter-spacing: -0.022em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 15px;
            font-weight: 500;
            color: #1d1d1f;
            margin-bottom: 8px;
            letter-spacing: -0.01em;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            font-size: 17px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(255, 255, 255, 0.8);
            color: #1d1d1f;
            letter-spacing: -0.022em;
        }

        input:focus {
            outline: none;
            border-color: #0071e3;
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.1);
            background: white;
        }
        
        input::placeholder {
            color: #86868b;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: #0071e3;
            border: none;
            border-radius: 24px;
            color: white;
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 8px;
            letter-spacing: -0.022em;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            background: #0051a8;
            box-shadow: 0 8px 20px rgba(0, 113, 227, 0.35);
        }

        .btn-primary:active {
            transform: translateY(0);
            transition: all 0.1s ease;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 16px 0;
            font-size: 15px;
            color: #86868b;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #1d1d1f;
            font-size: 15px;
        }

        .checkbox-wrapper input[type="checkbox"] {
            width: auto;
            cursor: pointer;
            accent-color: #0071e3;
        }

        a {
            color: #0071e3;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        a:hover {
            color: #0051a8;
        }

        a:hover {
            text-decoration: underline;
            color: #8b5cf6;
        }

        .divider {
            text-align: center;
            margin: 24px 0;
            position: relative;
        }

        .divider::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #2a2a2a;
        }

        .divider span {
            background: rgba(26, 26, 26, 0.95);
            padding: 0 16px;
            position: relative;
            color: #6b7280;
            font-size: 13px;
        }

        .demo-login {
            text-align: center;
            padding: 12px;
            background: #0a0a0a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            margin-top: 16px;
            font-size: 13px;
            color: #9ca3af;
        }

        .demo-login button {
            background: transparent;
            border: 1.5px solid #8b5cf6;
            color: #a78bfa;
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s;
        }

        .demo-login button:hover {
            background: rgba(139, 92, 246, 0.1);
            border-color: #6d28d9;
            color: #8b5cf6;
        }

        .footer-text {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: #86868b;
        }

        /* Loading animation */
        .loading {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .loading.active {
            display: flex;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="gradient-bg"></div>
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <i class="bi bi-briefcase-fill"></i>
            </div>
            <h1>Welcome Back</h1>
            <p class="subtitle">Sign in to track your job applications</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>

                <div class="remember-forgot">
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="remember">
                        <label for="remember" style="margin: 0; cursor: pointer;">Remember me</label>
                    </div>
                    <a href="#">Forgot password?</a>
                </div>

                <button type="submit" class="btn-primary">Sign In</button>
            </form>

            <div class="divider">
                <span>or</span>
            </div>

            <div class="demo-login">
                <p>Try without signing in</p>
                <button type="button" onclick="demoLogin()">Continue as Demo User</button>
            </div>

            <div class="footer-text">
                Don't have an account? <a href="#">Sign up</a>
            </div>
        </div>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            login();
        });

        function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Show loading
            document.getElementById('loading').classList.add('active');

            // Simulate API call
            setTimeout(() => {
                // For now, just set session and redirect
                sessionStorage.setItem('user', JSON.stringify({ email, name: email.split('@')[0] }));
                window.location.href = '/';
            }, 1000);
        }

        function demoLogin() {
            document.getElementById('loading').classList.add('active');
            setTimeout(() => {
                sessionStorage.setItem('user', JSON.stringify({ email: 'demo@jobtracker.com', name: 'Demo User' }));
                window.location.href = '/';
            }, 800);
        }

        // Check if already logged in
        if (sessionStorage.getItem('user')) {
            window.location.href = '/';
        }
    </script>
</body>
</html>
